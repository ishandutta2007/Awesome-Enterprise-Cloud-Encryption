<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>

    <!-- Animated Neon Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#38bdf8;#818cf8;#06b6d4" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(1.08); }
    }
    @keyframes orbitNode {
      0% { transform: rotate(0deg) translateX(45px) rotate(0deg); }
      100% { transform: rotate(360deg) translateX(45px) rotate(-360deg); }
    }
    @keyframes dataStream {
      0% { stroke-dashoffset: 600; opacity: 0.2; }
      50% { opacity: 0.8; }
      100% { stroke-dashoffset: 0; opacity: 0.2; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) scale(1); opacity: 0.3; }
      50% { transform: translateY(-14px) scale(1.2); opacity: 0.8; }
    }
    .grid-bg { opacity: 0.7; }
    .pulse-orb {
      transform-origin: 1050px 180px;
      animation: pulseGlow 6s ease-in-out infinite;
    }
    .pulse-orb-left {
      transform-origin: 120px 80px;
      animation: pulseGlow 8s ease-in-out infinite;
    }
    .stream-line {
      stroke-dasharray: 40, 20;
      animation: dataStream 12s linear infinite;
    }
    .p-1 { animation: floatParticle 4s ease-in-out infinite; }
    .p-2 { animation: floatParticle 5s ease-in-out infinite 1s; }
    .p-3 { animation: floatParticle 6s ease-in-out infinite 2s; }
    .p-4 { animation: floatParticle 4.5s ease-in-out infinite 1.5s; }
  </style>

  <!-- Deep Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#cyberGrid)" class="grid-bg" />

  <!-- Background Animated Ambient Light Orbs (Strictly behind all text) -->
  <g class="ambient-layer">
    <circle cx="1050" cy="180" r="140" fill="#38bdf8" filter="url(#glow)" class="pulse-orb" opacity="0.25" />
    <circle cx="120" cy="80" r="100" fill="#818cf8" filter="url(#glow)" class="pulse-orb-left" opacity="0.2" />
    <circle cx="600" cy="320" r="120" fill="#06b6d4" filter="url(#glow)" opacity="0.12" />

    <!-- Dynamic Cryptographic Data Stream Lines in background -->
    <path d="M 0 90 Q 300 130 600 70 T 1200 110" fill="none" stroke="#38bdf8" stroke-width="1.5" class="stream-line" opacity="0.4" />
    <path d="M 0 280 Q 400 220 800 290 T 1200 250" fill="none" stroke="#818cf8" stroke-width="1.2" class="stream-line" opacity="0.3" />

    <!-- Floating Cryptographic Particles (Safely outside text center) -->
    <circle cx="180" cy="60" r="3" fill="#38bdf8" class="p-1" />
    <circle cx="280" cy="300" r="2.5" fill="#a78bfa" class="p-2" />
    <circle cx="940" cy="80" r="3.5" fill="#38bdf8" class="p-3" />
    <circle cx="1120" cy="290" r="2" fill="#67e8f9" class="p-4" />
  </g>

  <!-- High-Tech Shield & Lock Emblem (Right Side Graphic) -->
  <g transform="translate(970, 90)">
    <!-- Shield Outer Frame -->
    <polygon points="80,10 150,35 150,110 80,160 10,110 10,35" fill="#0f172a" stroke="url(#borderGrad)" stroke-width="2.5" filter="url(#subtleGlow)" opacity="0.9" />
    <!-- Inner Lock Housing -->
    <rect x="52" y="75" width="56" height="48" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <path d="M 64 75 V 55 C 64 43 96 43 96 55 V 75" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <!-- Keyhole -->
    <circle cx="80" cy="94" r="5" fill="#38bdf8" />
    <path d="M 80 97 V 108" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <!-- Orbiting Key Node -->
    <g style="transform-origin: 80px 85px; animation: orbitNode 10s linear infinite;">
      <circle cx="80" cy="40" r="4" fill="#a78bfa" filter="url(#subtleGlow)" />
    </g>
  </g>

  <!-- Foreground Frame / Border -->
  <rect x="2" y="2" width="1196" height="356" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="2" opacity="0.85" />

  <!-- FOREGROUND CONTENT: Guaranteed pristine readability & clear focus -->
  <g id="foreground-content" transform="translate(70, 0)">
    <!-- Top Pill / Category Tag -->
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="310" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
      <circle cx="16" cy="15" r="5" fill="#10b981" />
      <text x="32" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">ENTERPRISE CLOUD SECURITY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#subtleGlow)">
      Awesome Enterprise Cloud Encryption
    </text>

    <!-- Subtitle -->
    <text x="0" y="195" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" letter-spacing="0.2">
      Curated Directory of Cloud Key Management (KMS), Envelope Encryption, BYOK &amp; Zero-Trust Data Protection
    </text>

    <!-- Capabilities Badges / Feature Tags in Foreground -->
    <g transform="translate(0, 240)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect width="130" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="65" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">☁️ Cloud KMS</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(142, 0)">
        <rect width="150" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="75" y="21" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">🔑 BYOK / HYOK</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(304, 0)">
        <rect width="175" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="87.5" y="21" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">🛡️ Envelope Encryption</text>
      </g>
      <!-- Badge 4 -->
      <g transform="translate(491, 0)">
        <rect width="165" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="82.5" y="21" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">🏢 Field &amp; DB Security</text>
      </g>
      <!-- Badge 5 -->
      <g transform="translate(668, 0)">
        <rect width="160" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="80" y="21" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">⚡ Confidential K8s</text>
      </g>
    </g>

    <!-- Bottom Meta Note -->
    <text x="0" y="315" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500">
      ⚡ Open Source Projects &amp; Enterprise SaaS • Updated Monthly • FIPS 140-2/3 &amp; Zero-Trust Ready
    </text>
  </g>
</svg>
